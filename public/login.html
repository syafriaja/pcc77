<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ShinePos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-900 flex items-center justify-center min-h-screen p-6">
    <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md">
      <div class="text-center mb-10">
        <h1 class="text-4xl font-black italic text-slate-900">
          SHINE<span class="text-indigo-600">POS</span>
        </h1>
        <p class="text-slate-400 font-bold mt-2">Masuk ke Dashboard Sistem</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <input
          type="text"
          id="user"
          placeholder="Username"
          class="w-full p-4 bg-slate-100 rounded-2xl font-bold border-none outline-indigo-500"
          required
        />
        <!-- Input password dibuat relative agar tombol ikon show/hide bisa ditempatkan di kanan input. -->
        <div class="relative">
          <input
            type="password"
            id="pass"
            placeholder="Password"
            class="w-full p-4 pr-16 bg-slate-100 rounded-2xl font-bold border-none outline-indigo-500"
            required
          />
          <button
            type="button"
            id="togglePassword"
            aria-label="Lihat password"
            title="Lihat password"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-indigo-600 hover:text-indigo-800"
          >
            <svg
              id="passwordIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12s-3.75 6.75-9.75 6.75S2.25 12 2.25 12z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 9.75A2.25 2.25 0 1 1 12 14.25A2.25 2.25 0 0 1 12 9.75z"
              />
            </svg>
          </button>
        </div>
        <p
          id="err"
          class="text-red-500 text-xs font-bold text-center hidden"
        ></p>
        <button
          type="submit"
          class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl hover:bg-indigo-700 shadow-xl shadow-indigo-200 transition-all"
        >
          MASUK SEKARANG
        </button>
      </form>
    </div>
    <script>
      // Tombol ini membantu user mengecek salah ketik password tanpa mengirim atau mencatat password ke server.
      document.getElementById("togglePassword").onclick = () => {
        const pass = document.getElementById("pass");
        const toggle = document.getElementById("togglePassword");
        const icon = document.getElementById("passwordIcon");
        const shouldShow = pass.type === "password";

        pass.type = shouldShow ? "text" : "password";
        toggle.setAttribute(
          "aria-label",
          shouldShow ? "Sembunyikan password" : "Lihat password",
        );
        toggle.setAttribute(
          "title",
          shouldShow ? "Sembunyikan password" : "Lihat password",
        );
        icon.innerHTML = shouldShow
          ? `<path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
             <path stroke-linecap="round" stroke-linejoin="round" d="M10.73 5.08A10.56 10.56 0 0 1 12 5.25c6 0 9.75 6.75 9.75 6.75a18.74 18.74 0 0 1-3.04 3.82" />
             <path stroke-linecap="round" stroke-linejoin="round" d="M6.53 6.53C3.84 8.34 2.25 12 2.25 12s3.75 6.75 9.75 6.75c1.55 0 2.96-.45 4.2-1.12" />
             <path stroke-linecap="round" stroke-linejoin="round" d="M9.88 9.88A2.25 2.25 0 0 0 12 14.25c.85 0 1.59-.47 1.97-1.16" />`
          : `<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12s-3.75 6.75-9.75 6.75S2.25 12 2.25 12z" />
             <path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75A2.25 2.25 0 1 1 12 14.25A2.25 2.25 0 0 1 12 9.75z" />`;
      };

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value,
          }),
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = "/index.html";
        } else {
          const err = document.getElementById("err");
          err.innerText = data.message;
          err.classList.remove("hidden");
        }
      };
    </script>
  </body>
</html>
