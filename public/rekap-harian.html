<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rekap Harian - ShinePos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
      <!-- Navigasi -->
      <div class="flex justify-between items-center mb-8">
        <a
          href="/index.html"
          class="flex items-center gap-2 text-indigo-600 font-bold text-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="3"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            />
          </svg>
          KEMBALI KE DASHBOARD
        </a>
        <div id="dateFilterArea" class="hidden flex gap-2">
          <input
            type="date"
            id="reportDate"
            class="p-2 rounded-xl border border-slate-200 font-bold text-sm outline-indigo-500"
          />
          <button
            onclick="loadDailyReport()"
            class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-sm"
          >
            Cari
          </button>
        </div>
      </div>

      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
          Rekap Operasional
        </h1>
        <p id="currentDateDisplay" class="text-slate-500 font-medium text-sm">
          Memuat tanggal...
        </p>
      </div>

      <!-- Summary Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div
          class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100"
        >
          <p
            class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1"
          >
            Total Unit
          </p>
          <h3 id="statUnits" class="text-xl font-black text-slate-900">
            0 / 0
          </h3>
        </div>
        <div
          class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100"
        >
          <p
            class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1"
          >
            Mulai Operasional
          </p>
          <h3 id="statStart" class="text-xl font-black text-indigo-600">
            --:--
          </h3>
        </div>
        <div
          class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100"
        >
          <p
            class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1"
          >
            Update Terakhir
          </p>
          <h3 id="statLast" class="text-xl font-black text-indigo-600">
            --:--
          </h3>
        </div>
        <div
          id="revenueStatCard"
          class="hidden bg-slate-900 p-6 rounded-[2rem] shadow-xl"
        >
          <p
            class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1"
          >
            Pendapatan
          </p>
          <h3 id="statRevenue" class="text-lg font-black text-white">Rp 0</h3>
        </div>
      </div>

      <!-- Table -->
      <div
        class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden"
      >
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-100">
              <tr>
                <th
                  class="p-6 text-[10px] font-black text-slate-400 uppercase tracking-widest"
                >
                  Waktu
                </th>
                <th
                  class="p-6 text-[10px] font-black text-slate-400 uppercase tracking-widest"
                >
                  Kendaraan
                </th>
                <th
                  class="p-6 text-[10px] font-black text-slate-400 uppercase tracking-widest"
                >
                  Petugas
                </th>
                <th
                  class="p-6 text-[10px] font-black text-slate-400 uppercase tracking-widest"
                >
                  Harga
                </th>
                <th
                  class="p-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right"
                >
                  Metode
                </th>
              </tr>
            </thead>
            <tbody id="reportTableBody" class="divide-y divide-slate-50">
              <!-- Data Masuk Disini -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Script untuk interaktivitas dan koneksi backend -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="/js/realtime.js"></script>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) window.location.href = "/login.html";

      const today = new Date().toISOString().split("T")[0];
      document.getElementById("reportDate").value = today;

      // Tampilan khusus Owner
      if (user.role === "owner") {
        document.getElementById("dateFilterArea").classList.remove("hidden");
        document.getElementById("revenueStatCard").classList.remove("hidden");
      }

      async function loadDailyReport() {
        const date = document.getElementById("reportDate").value;
        const tbody = document.getElementById("reportTableBody");
        const formatIDR = (n) =>
          new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0,
          }).format(n || 0);

        document.getElementById("currentDateDisplay").innerText = new Date(
          date,
        ).toLocaleDateString("id-ID", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });

        try {
          const res = await fetch(
            `/api/rekap-harian?date=${date}&role=${user.role}`,
          );
          const data = await res.json();

          if (data.transactions.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-20 text-center text-slate-400 italic">Belum ada aktivitas pada tanggal ini.</td></tr>`;
            resetStats();
            return;
          }

          // Update Ringkasan
          document.getElementById("statUnits").innerText =
            `${data.summary.mobil} M / ${data.summary.motor} T`;
          document.getElementById("statStart").innerText =
            data.summary.startTime || "--:--";
          document.getElementById("statLast").innerText =
            data.summary.lastTime || "--:--";
          if (user.role === "owner") {
            document.getElementById("statRevenue").innerText = formatIDR(
              data.summary.revenue,
            );
          }

          // Update Tabel
          tbody.innerHTML = data.transactions
            .map(
              (t) => `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="p-6 font-bold text-slate-900">${t.time}</td>
                    <td class="p-6">
                      <div class="flex items-center gap-2">
                      <span class="text-lg">
                        ${t.vehicle_type === "mobil" ? "🚗" : "🏍️"}
                      </span>
                      <div>
                      <p class="font-black text-slate-900 text-sm">
                        ${t.vehicle_brand || t.vehicle_type}
                      </p>
                      <div class="mt-1">
  <span class="
    px-2 py-1 rounded-full text-[10px] font-black uppercase
    ${
      t.status === "selesai"
        ? "bg-green-100 text-green-600"
        : t.status === "sedang_dicuci"
          ? "bg-blue-100 text-blue-600"
          : "bg-slate-200 text-slate-600"
    }
  ">
    ${
      t.status === "selesai"
        ? "✅ Selesai"
        : t.status === "sedang_dicuci"
          ? "🧼 Sedang Dicuci"
          : "⏳ Dalam Antrian"
    }
  </span>
</div>
                      <p class="text-[10px] font-black text-slate-400 uppercase">
                        ${t.vehicle_type}
                      </p>
                    </div>
                  </div>
                </td>
                    <td class="p-6 font-semibold text-slate-600 text-sm">${t.employee_name}</td>
                    <td class="p-6 font-bold text-slate-900 text-sm">${formatIDR(t.price)}</td>
                    <td class="p-6 text-right font-black text-slate-400 text-[10px] uppercase">Cash</td>
                </tr>
            `,
            )
            .join("");
        } catch (e) {
          console.error("Gagal memuat rekap:", e);
        }
      }

      function resetStats() {
        document.getElementById("statRevenue").innerText = "Rp 0";
        document.getElementById("statUnits").innerText = "0 / 0";
        document.getElementById("statStart").innerText = "--:--";
        document.getElementById("statLast").innerText = "--:--";
      }

      loadDailyReport();

      window.addEventListener("refresh-data", () => {
        loadDailyReport();
      });
    </script>
  </body>
</html>
